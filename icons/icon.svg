<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0b0d12"/>
      <stop offset="100%" style="stop-color:#1a1d2e"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#6c8cff"/>
      <stop offset="100%" style="stop-color:#38d9a9"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" rx="80" fill="url(#bg)"/>
  <rect x="40" y="40" width="432" height="432" rx="60" fill="none" stroke="url(#accent)" stroke-width="4" opacity="0.3"/>
  
  <!-- Grid of 12 buttons (3x4) -->
  <g fill="url(#accent)" opacity="0.9">
    <rect x="70" y="70" width="90" height="90" rx="15"/>
    <rect x="180" y="70" width="90" height="90" rx="15"/>
    <rect x="290" y="70" width="90" height="90" rx="15"/>
    <rect x="400" y="70" width="90" height="90" rx="15"/>
    
    <rect x="70" y="180" width="90" height="90" rx="15"/>
    <rect x="180" y="180" width="90" height="90" rx="15"/>
    <rect x="290" y="180" width="90" height="90" rx="15"/>
    <rect x="400" y="180" width="90" height="90" rx="15"/>
    
    <rect x="70" y="290" width="90" height="90" rx="15"/>
    <rect x="180" y="290" width="90" height="90" rx="15"/>
    <rect x="290" y="290" width="90" height="90" rx="15"/>
    <rect x="400" y="290" width="90" height="90" rx="15"/>
  </g>
  
  <!-- Two dials at bottom -->
  <g fill="none" stroke="url(#accent)" stroke-width="8" opacity="0.8">
    <circle cx="160" cy="420" r="45"/>
    <circle cx="352" cy="420" r="45"/>
  </g>
  
  <!-- Dial indicators -->
  <g stroke="url(#accent)" stroke-width="6" stroke-linecap="round">
    <line x1="160" y1="420" x2="160" y2="380" transform="rotate(-45 160 420)"/>
    <line x1="352" y1="420" x2="352" y2="380" transform="rotate(45 352 420)"/>
  </g>
  
  <!-- DeskPad text -->
  <text x="256" y="480" font-family="system-ui, sans-serif" font-size="24" font-weight="bold" fill="url(#accent)" text-anchor="middle">DeskPad</text>
</svg>