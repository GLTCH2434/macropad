<!DOCTYPE html>
<!--
  Macropad Simulator - index.html
  Structure only. Everything inside the elements marked "filled by app.js"
  is generated by JavaScript, so the page can redraw itself whenever you
  switch layers or change the configuration.

  Layout (landscape tablet):
  +--------------------------------------------------------------+
  | top bar: title | layer | device status | buttons              |
  +--------------------------+-----------------------------------+
  |                          |  layer keys (1 x 4)               |
  |   12 custom keys         |-----------------------------------|
  |   (3 x 4 grid)           |  layer keys                       |
  |                          |                                   |
  |                          |  knobs                            |
  +--------------------------+-----------------------------------+
-->
<html lang="en">
<head>
  <meta charset="UTF-8">
  <!-- user-scalable=no stops pinch / double-tap zoom, which would fight with fast key taps -->
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#0b0d12">
  <title>Macropad Simulator</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body data-layer="0">

  <main class="macropad">

    <!-- ===== Top bar: title, active layer, device link status and the main buttons ===== -->
    <header class="topbar">
      <h1 class="pad-title">Macropad</h1>
      <div class="layer-indicator" id="layer-indicator" aria-live="polite">Layer 1</div>
      <button type="button" class="btn" id="layer-toggle" title="Switch to the next layer">Next layer</button>

      <!-- Shows whether a real device is connected over Web Serial -->
      <div class="device-pill" id="device-status" title="Hardware link status">
        <span class="device-dot"></span>
        <span id="device-status-text">No device</span>
      </div>
      <button type="button" class="btn" id="connect-btn">Connect</button>
      <button type="button" class="btn" id="fullscreen-btn" hidden>Fullscreen</button>
      <button type="button" class="btn btn-primary" id="configure-btn">Configure</button>
    </header>

    <section class="pad-body">

      <!-- LEFT HALF: 12 custom keys as a 3 x 4 grid (filled by app.js) -->
      <section class="keys-pane" aria-label="Keys">
        <div class="custom-keys" id="custom-keys"></div>
      </section>

      <!-- RIGHT HALF: layer keys at the top and per-layer dials at the bottom -->
      <section class="side-pane">
        <div class="layer-keys" id="layer-keys" aria-label="Layer keys"></div>
        <div class="knobs" id="knobs" aria-label="Knobs"></div>
      </section>
    </section>
  </main>

  <!-- ===== Configuration modal (hidden until "Configure" is clicked) ===== -->
  <div class="modal-backdrop" id="config-modal" hidden>
    <div class="modal" role="dialog" aria-modal="true" aria-labelledby="config-title">
      <div class="modal-header">
        <h2 id="config-title">Configure</h2>
        <button type="button" class="icon-btn" id="config-close" aria-label="Close">&times;</button>
      </div>

      <!-- Four tabs: which one is shown is controlled by app.js -->
      <div class="tabs" role="tablist">
        <button type="button" class="tab active" role="tab" data-tab="keys">Custom Keys</button>
        <button type="button" class="tab" role="tab" data-tab="layers">Layer Keys</button>
        <button type="button" class="tab" role="tab" data-tab="knobs">Knobs</button>
        <button type="button" class="tab" role="tab" data-tab="device">Device</button>
      </div>

      <!-- The form for the active tab is generated here -->
      <div class="modal-body" id="config-body"></div>

      <div class="modal-footer">
        <button type="button" class="btn btn-danger" id="config-reset">Reset to defaults</button>
        <button type="button" class="btn btn-primary" id="config-done">Done</button>
      </div>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
